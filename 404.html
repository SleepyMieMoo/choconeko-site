<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · ChocoNeko</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1C1410" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#DAC6AC" media="(prefers-color-scheme: light)">
  <!-- Apply the saved theme before CSS paints (see js/main.js) -->
  <script>(function(){var t;try{t=localStorage.getItem("choconeko-theme")}catch(e){}document.documentElement.setAttribute("data-theme",/^[a-z0-9-]{1,40}$/.test(t||"")?t:"system")})();</script>
  <link rel="icon" href="/choconeko-site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/choconeko-site/css/themes.css">
  <link rel="stylesheet" href="/choconeko-site/css/style.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; display: flex; }
    main .hero { flex: 1; display: flex; align-items: center; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/choconeko-site/"><img src="/choconeko-site/img/logo.svg" alt="" width="40" height="40">ChocoNeko</a>
      <div class="theme-picker" hidden>
        <label for="theme-select">Theme</label>
        <span class="select-wrap"><select id="theme-select"><option value="system">System (match device)</option></select></span>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="wrap">
        <img class="hero-logo" src="/choconeko-site/img/logo.svg" alt="ChocoNeko cat logo" width="132" height="132">
        <div class="status-pill">404 · page not found</div>
        <h1>Choco<span>Neko</span></h1>
        <p class="tagline">This page wandered off like a sleepy cat. It may have moved or never existed.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/choconeko-site/">Back to the home page</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="footer-small">© 2026 ChocoNeko. In development, coming soon. Not affiliated with or endorsed by Roblox Corporation.</p>
    </div>
  </footer>

  <script src="/choconeko-site/js/main.js"></script>
</body>
</html>
